<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina niet gevonden | MORGEN</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0C0818">
  <link rel="icon" href="/favicon-company.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&amp;display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      color: #F4F0FA;
      background:
        radial-gradient(circle at 18% 18%, rgba(91, 45, 142, .48), transparent 34rem),
        radial-gradient(circle at 82% 76%, rgba(155, 111, 207, .24), transparent 30rem),
        #0C0818;
      font-family: 'Barlow', system-ui, sans-serif;
    }
    main {
      position: relative;
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(155, 111, 207, .42);
      border-radius: 28px;
      background: rgba(18, 11, 33, .72);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .42);
      backdrop-filter: blur(16px);
    }
    .merk {
      color: inherit;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-decoration: none;
    }
    .merk span { color: #D8FE56; }
    .code {
      margin: clamp(42px, 8vw, 72px) 0 8px;
      color: #D8FE56;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 10ch;
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 900;
      line-height: .94;
    }
    p {
      max-width: 52ch;
      margin: 24px 0 0;
      color: #C9B9DD;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.55;
    }
    .acties {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    .acties a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 11px 22px;
      border: 1px solid rgba(244, 240, 250, .28);
      border-radius: 999px;
      color: inherit;
      font-weight: 700;
      text-decoration: none;
    }
    .acties .primair {
      border-color: #D8FE56;
      color: #0C0818;
      background: #D8FE56;
    }
    .acties a:focus-visible {
      outline: 3px solid #9B6FCF;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <a class="merk" href="/wereld/">MORGEN<span>.</span></a>
    <p class="code">404</p>
    <h1>Hier loopt het pad niet verder.</h1>
    <p>Deze pagina bestaat niet of is verplaatst. Ga terug naar de wereld van Morgen of bekijk direct ons aanbod.</p>
    <div class="acties">
      <a class="primair" href="/wereld/">Terug naar de wereld</a>
      <a href="/organisatie/#aanbod">Bekijk het aanbod</a>
    </div>
  </main>
</body>
</html>

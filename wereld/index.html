<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Morgen | Stap de wereld binnen</title>
  <meta name="description" content="Vlieg de wereld van Morgen binnen en ontdek wat we doen: Train, Implement, Build en Inspire.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wereld.css">
  <link rel="stylesheet" href="/docs/academy-chat/chat.css">
</head>
<body data-state="boot">

  <h1 class="sr-only">De wereld van Morgen</h1>

  <!-- Minimale nav-balk, boven alle states -->
  <nav class="wereld-nav" aria-label="Hoofdnavigatie">
    <a class="wereld-merk" href="/wereld/" aria-label="Morgen wereld, terug naar start">MORGEN<span class="wereld-merk-punt" aria-hidden="true">.</span></a>
    <a class="wereld-huidige" href="/">Huidige site</a>
  </nav>

  <!-- Hub: het plein met de vier gebouwen -->
  <section id="hub" class="stage" tabindex="-1" aria-label="Het Morgen-plein">
    <img id="hub-still" class="hub-still" alt="Overzicht van het Morgen-plein met vier gebouwen">
    <div id="hotspots" class="hotspots"></div>
  </section>

  <!-- Cinematics: intro-vlucht en dive delen 1 video-element -->
  <section id="cine" class="stage" aria-label="Vlucht door de wereld">
    <video id="cine-video" muted playsinline preload="auto"></video>
    <button id="skip-intro" class="knop-ghost skip-knop" type="button">Sla intro over</button>
  </section>

  <!-- Binnen-verhaal: scroll-gescrubd via de scrub-engine -->
  <div id="verhaal">
    <div id="world"></div>
    <button id="exit-verhaal" class="knop-ghost exit-knop" type="button">Terug naar het plein</button>
    <aside id="verhaal-einde" class="einde" aria-label="Einde van het verhaal">
      <!-- Generiek eindpaneel: wordt per gebouw gevuld door wereld.js -->
      <p class="einde-eyebrow" id="einde-eyebrow"></p>
      <h2 class="einde-titel" id="einde-titel"></h2>
      <ul class="einde-lijst" id="einde-lijst"></ul>
      <div class="einde-acties">
        <a class="knop-accent" id="einde-cta" href="/academy/"></a>
        <a class="knop-ghost" id="einde-cta2" href="#" hidden></a>
        <button class="knop-ghost" id="einde-terug" type="button">Terug naar het plein</button>
      </div>
    </aside>
  </div>

  <!-- het Kompas: opent als vak onderaan (bij de brug) vanaf de hub -->
  <aside id="kompas-paneel" class="kompas-paneel" aria-label="het Kompas" hidden>
    <button id="kompas-sluit" class="kompas-sluit" type="button" aria-label="Sluit het Kompas">&#215;</button>
    <p class="kompas-eyebrow">Wegwijzer</p>
    <h2 class="kompas-titel">Waar kunnen we je mee helpen?</h2>
    <p class="kompas-sub">Beschrijf je situatie, wij wijzen je de eerste stap.</p>
    <div data-kompas></div>
  </aside>

  <!-- Logo-ticker, loopt onderin tijdens het Projecten-verhaal -->
  <div id="wereld-ticker" class="wereld-ticker" aria-label="Klanten en projecten" hidden>
    <div class="logo-band">
      <div class="logo-track" id="ticker-track"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript-melding">
      <p>Deze pagina heeft JavaScript nodig. Bekijk in plaats daarvan de <a href="/">huidige site</a>.</p>
    </div>
  </noscript>

  <script src="scrub-engine.js"></script>
  <script src="wereld.js"></script>
  <script type="module" src="/docs/academy-chat/chat.js"></script>
</body>
</html>
